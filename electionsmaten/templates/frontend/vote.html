{% extends "shared/base.html" %}

{% block content %}

<style>

body{
    direction:rtl;
    background:#f4f6f8;
    margin:0;
    font-family:Arial,sans-serif;
}


/* ================= HEADER ================= */

.arabic-header{

    background:#0F5C6E;

    color:white;

    text-align:center;

    padding:20px;

    font-size:38px;

    font-weight:bold;

}


/* ================= MAIN CONTAINER ================= */

.vote-container{

    width:95%;

    max-width:1700px;

    margin:35px auto;

    background:white;

    border-radius:12px;

    box-shadow:0 4px 15px rgba(0,0,0,.12);

    padding:30px;

}


/* ================= SECTIONS ================= */

.vote-section{

    margin-bottom:35px;

}


.vote-section h2{

    color:#0F5C6E;

    font-size:28px;

    margin-bottom:20px;

}


/* ================= TABLE ================= */

table{

    width:100%;

    border-collapse:collapse;

    background:white;

}


th{

    background:#0F5C6E;

    color:white;

    padding:12px;

    font-size:18px;

}


td{

    padding:12px;

    border-bottom:1px solid #ddd;

    text-align:center;

    font-size:17px;

}


tr:hover{

    background:#f1f7f8;

}


/* ================= RADIO ================= */

input[type="radio"]{

    transform:scale(1.3);

}


/* ================= BUTTON ================= */

button{

    background:#0F5C6E;

    color:white;

    border:none;

    padding:14px 35px;

    border-radius:8px;

    font-size:18px;

    cursor:pointer;

}


button:hover{

    background:#09424f;

}


/* ================= BACK ================= */

.back-button{

    display:inline-block;

    margin-top:25px;

    background:#555;

    color:white;

    padding:12px 25px;

    border-radius:8px;

    text-decoration:none;

}


.back-button:hover{

    background:#333;

}


</style>



<div class="vote-container">


    <!-- HEADER -->

    <div class="arabic-header">

        الانتخابات النيابية 2028

        <br>

        {{ district_name }}

        <br>

        قلم رقم {{ ballot_number }}

    </div>



    <br>


    <form id="vote-form">



        <!-- LISTS -->

        <div class="vote-section">

            <h2>
                اختيار اللائحة
            </h2>


            <table>

                <tr>

                    <th>
                        اللائحة
                    </th>

                    <th>
                        اختيار
                    </th>

                </tr>


                {% for list in lists %}

                <tr>

                    <td>
                        {{ list.name }}
                    </td>


                    <td>

                        <input
                            type="radio"
                            name="list_id"
                            class="list-radio"
                            value="{{ list.id }}"
                        >

                    </td>

                </tr>

                {% endfor %}


            </table>


        </div>




        <!-- CANDIDATES -->

        <div class="vote-section">


            <h2>
                اختيار المرشح
            </h2>


            <table id="candidate-table">

                <tr>

                    <td colspan="2">

                        اختر اللائحة أولاً

                    </td>

                </tr>


            </table>


        </div>




        <button type="submit">

            تسجيل الصوت

        </button>



    </form>



    <a href="{{ url_for('frontend_bp.dashboard') }}"
       class="back-button">

        العودة إلى لوحة التحكم

    </a>


</div>





<script>

document.addEventListener("DOMContentLoaded", () => {


    const voteForm = document.getElementById("vote-form");

    const candidateTable =
        document.getElementById("candidate-table");



    document.querySelectorAll(".list-radio")
    .forEach(radio => {


        radio.addEventListener("change", () => {


            console.log(
                "Selected list:",
                radio.value
            );


            fetch(`/get-candidates/${radio.value}`)

            .then(res => {

                console.log(
                    "Response status:",
                    res.status
                );

                return res.json();

            })

            .then(data => {


                console.log(
                    "Candidates response:",
                    data
                );



                let html = `

                <tr>

                    <th>
                        الاسم
                    </th>

                    <th>
                        اختيار
                    </th>

                </tr>


                <tr>

                    <td>
                        بدون مرشح (اللائحة فقط)
                    </td>


                    <td>

                        <input
                        type="radio"
                        name="candidate_id"
                        value="">

                    </td>

                </tr>

                `;



                if (
                    !data.candidates ||
                    data.candidates.length === 0
                ){


                    html += `

                    <tr>

                        <td colspan="2">

                            لا يوجد مرشحون

                        </td>

                    </tr>

                    `;


                }

                else{


                    data.candidates.forEach(c => {


                        html += `

                        <tr>


                            <td>

                                ${c.name}

                            </td>


                            <td>


                                <input

                                type="radio"

                                name="candidate_id"

                                value="${c.candidate_id}">


                            </td>


                        </tr>

                        `;


                    });


                }



                candidateTable.innerHTML = html;


            })

            .catch(error => {


                console.error(
                    "Error loading candidates:",
                    error
                );


                candidateTable.innerHTML = `

                <tr>

                    <td colspan="2">

                        خطأ في تحميل المرشحين

                    </td>

                </tr>

                `;


            });


        });


    });





    voteForm.addEventListener("submit", e => {


        e.preventDefault();



        const formData =
            new FormData(voteForm);



        fetch("/submit-vote", {


            method:"POST",

            body:formData


        })


        .then(res => res.json())


        .then(data => {



            if(data.error){


                alert(data.error);

                return;


            }



            alert(
                "تم تسجيل الصوت بنجاح"
            );



            voteForm.reset();



            candidateTable.innerHTML = `

            <tr>

                <td colspan="2">

                    اختر اللائحة أولاً

                </td>

            </tr>

            `;



        })


        .catch(error => {


            console.error(
                "Vote submission error:",
                error
            );


            alert(
                "حدث خطأ أثناء تسجيل الصوت"
            );


        });



    });



});

</script>


{% endblock %}
