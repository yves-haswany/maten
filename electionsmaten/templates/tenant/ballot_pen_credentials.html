<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>مفاتيح اقلام الاقتراع</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>


<body class="bg-gray-100 min-h-screen p-6">


<header class="flex justify-between items-center mb-6">

    <h1 class="text-3xl font-bold">
        مفاتيح اقلام الاقتراع
    </h1>


    <a href="{{ url_for('tenant.dashboard') }}"
       class="logout-button">

        عودة إلى لوحة التحكم

    </a>

</header>



<div class="dashboard-grid">


{% for district in districts %}


<div class="dashboard-card">


<h2>
{{ district.name }}
</h2>


<p>
ادخل مفاتيح الاقلام الخاصة بهذا الدائرة الانتخابية للوصول إلى أقلام الاقتراع.
</p>



<a href="{{ url_for(
    'tenant.ballot_pens',
    district_id=district.id
) }}"
class="btn">


اقلام الاقتراع


</a>


</div>


{% else %}


<div class="dashboard-card">

<p>
لا دوائر انتخابية متاحة. يرجى إضافة دائرة انتخابية أولاً.
</p>

</div>


{% endfor %}



</div>


</body>

</html>
