<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Manage Districts</title>

<style>
/* ===== your CSS unchanged (kept as-is) ===== */
body{font-family:Arial,sans-serif;background:#f4f6f8;padding:40px;margin:0;}
.container{max-width:950px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);}
h1,h2,h3{text-align:center;margin-bottom:20px;color:#333;}
hr{margin:30px 0;border:none;border-top:1px solid #ddd;}
label{display:block;margin-top:12px;margin-bottom:6px;font-weight:bold;}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;margin-bottom:10px;}
textarea{width:100%;box-sizing:border-box;}
button{border:none;border-radius:8px;cursor:pointer;}
.btn{width:100%;padding:12px;background:#4a90e2;color:white;margin-top:15px;}
.add-btn{width:100%;padding:10px;margin-top:10px;background:#28a745;color:white;}
.small-btn{padding:8px 12px;border-radius:6px;color:white;}
.edit{background:#28a745;}
.delete{background:#dc3545;}
.section{border:1px solid #ddd;border-radius:10px;padding:15px;margin-top:15px;}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;}
.row input,.row select{flex:1;}
.card{border:1px solid #ddd;border-radius:10px;padding:15px;margin-top:20px;}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;}
.list-row:last-child{border-bottom:none;}
.sub-row{margin-left:25px;margin-top:8px;}
.sect-row{margin-left:50px;color:#666;font-size:14px;}
.hidden{display:none;}
.flash{background:#d4edda;color:#155724;padding:12px;border-radius:8px;margin-bottom:20px;}
.back{display:inline-block;margin-top:25px;text-decoration:none;}
</style>

</head>

<body>

<div class="container">

<h1>إدارة الدوائر</h1>

<!-- ================= FLASH ================= -->
{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}
<div class="flash">{{ message }}</div>
{% endfor %}
{% endif %}
{% endwith %}

<!-- ================= JSON DATA FOR JS ================= -->
<script id="subdistrict-data" type="application/json">
    {{ subdistricts | tojson }}
</script>

<script id="sect-data" type="application/json">
    {{ sects | tojson }}
</script>

<!-- ================= CREATE DISTRICT ================= -->
<h2>إنشاء دائرة جديدة</h2>

<form method="POST" id="createDistrictForm">

<label>رمز الدائرة</label>
<input type="text" name="code" required>

<label>اسم الدائرة</label>
<input type="text" name="name" required>

<hr>

<h3>الأقضية وتوزيع المقاعد</h3>

<div id="subdistrictContainer"></div>

<button type="button" class="add-btn" id="addSubdistrictButton">
+ إضافة قضاء
</button>

<button type="submit" class="btn">حفظ الدائرة</button>

</form>

<hr>

<!-- ================= MANAGE ================= -->
<h2>إدارة الدوائر المسجلة</h2>

<label>اختر دائرة</label>

<select id="districtSelector">
<option value="all">-- جميع الدوائر --</option>

{% for district in districts %}
<option value="{{ district.id }}">
    {{ district.code }} - {{ district.name }}
</option>
{% endfor %}

</select>

<!-- ================= LIST VIEW ================= -->
<div id="listView" class="card"></div>

<!-- ================= EDITOR ================= -->
<div id="editor" class="card hidden">

<h3 id="editorTitle"></h3>

<form id="editDistrictForm">

<input type="hidden" id="districtId">

<label>رمز الدائرة</label>
<input type="text" id="editCode">

<label>اسم الدائرة</label>
<input type="text" id="editName">

<hr>

<h3>الأقضية</h3>

<div id="editSubdistrictContainer"></div>

<button type="submit" class="btn edit">
    تحديث الدائرة
</button>

</form>

<form id="deleteDistrictForm">
<button type="submit" class="btn delete">
    حذف الدائرة
</button>
</form>

</div>

</div>

<hr>

<a class="back" href="{{ url_for('admin.dashboard') }}">
العودة إلى لوحة التحكم
</a>

</div>

</body>
</html>

<!-- ========================================= -->
<!-- DATA FOR JAVASCRIPT                       -->
<!-- ========================================= -->

<script
id="district-data"
type="application/json">

{{ districts|tojson|safe }}

</script>

<script
id="subdistrict-data"
type="application/json">

{{ subdistricts|tojson|safe }}

</script>

<script
id="sect-data"
type="application/json">

{{ sects|tojson|safe }}

</script>
<script>

/* ==========================================================
   LOAD JSON DATA
========================================================== */

const subdistrictOptions = JSON.parse(
    document.getElementById("subdistrict-data").textContent || "[]"
);

const sectOptions = JSON.parse(
    document.getElementById("sect-data").textContent || "[]"
);

const districts = JSON.parse(
    document.getElementById("district-data").textContent || "[]"
);

/* ==========================================================
   DOM ELEMENTS (FIXED NAMES)
========================================================== */

const selector =
    document.getElementById("districtSelector");

const listView =
    document.getElementById("listView");

const editor =
    document.getElementById("editor");

const editCode =
    document.getElementById("editCode");

const editName =
    document.getElementById("editName");

const districtDetails =
    document.getElementById("districtDetails");

const editForm =
    document.getElementById("editDistrictForm");

const deleteForm =
    document.getElementById("deleteDistrictForm");

const subdistrictContainer =
    document.getElementById("subdistrictContainer");

const createForm =
    document.getElementById("createDistrictForm");

/* ==========================================================
   INIT
========================================================== */

window.onload = function () {
    selector.value = "all";
    renderAll();
};

/* ==========================================================
   SELECT CHANGE
========================================================== */

selector.addEventListener("change", loadDistrict);

function loadDistrict() {
    if (selector.value === "all") {
        renderAll();
    } else {
        renderDistrict(selector.value);
    }
}

/* ==========================================================
   RENDER ALL
========================================================== */

function renderAll() {

    editor.classList.add("hidden");

    let html = "<h3>جميع الدوائر</h3>";

    districts.forEach(d => {
        html += `
            <div class="row" onclick="selectDistrict(${d.id})" style="cursor:pointer">
                <div>
                    <strong>${d.code}</strong> - ${d.name}
                </div>
            </div>
        `;
    });

    listView.innerHTML = html;
}

/* ==========================================================
   SELECT DISTRICT
========================================================== */

function selectDistrict(id) {
    selector.value = id;
    renderDistrict(id);
}

/* ==========================================================
   RENDER EDITOR (FIXED CORE ISSUE)
========================================================== */

function renderDistrict(id) {

    const district = districts.find(d => d.id == id);

    if (!district) return;

    listView.innerHTML = "";
    editor.classList.remove("hidden");

    /* -------------------------
       FIX: populate fields
    ------------------------- */

    document.getElementById("districtId").value = district.id;
    editCode.value = district.code;
    editName.value = district.name;

    editForm.action = "/admin/district/edit/" + district.id;
    deleteForm.action = "/admin/district/delete/" + district.id;

    document.getElementById("deleteDistrictId").value = district.id;

    /* -------------------------
       preview
    ------------------------- */

    document.getElementById("selectedDistrictPreview").textContent =
        `${district.code} - ${district.name}`;

    /* -------------------------
       CLEAR containers
    ------------------------- */

    const container = document.getElementById("editSubdistrictContainer");
container.innerHTML = "";

district.subdistricts.forEach((sub, index) => {

    const section = document.createElement("div");
    section.className = "section";

    section.innerHTML = `
        <h4>قضاء ${index + 1}</h4>

        <label>القضاء</label>
        <select class="subdistrict-select">
            ${buildSubdistrictOptions(sub.id)}
        </select>

        <label>عدد المقاعد</label>
        <input type="number" class="subdistrict-seats" min="1" value="${sub.total_seats}">

        <hr>

        <h4>توزيع المقاعد حسب الطوائف</h4>

        <div class="sectContainer"></div>

        <button type="button" class="add-btn" onclick="addSect(this)">
            + إضافة طائفة
        </button>
    `;

    const sectContainer = section.querySelector(".sectContainer");

    if (!sub.sects || sub.sects.length === 0) {

        sectContainer.innerHTML = `
            <div style="color:#888;font-size:14px">
                لا يوجد طوائف مضافة
            </div>
        `;

    } else {

        sub.sects.forEach((sect, sIndex) => {

            const row = document.createElement("div");
            row.className = "row";

            row.innerHTML = `
                <label style="min-width:80px">طائفة ${sIndex + 1}</label>

                <select class="sect-select">
                    ${buildSectOptions(sect.id)}
                </select>

                <input type="number" class="sect-seats" min="1" value="${sect.seats}">

                <button type="button" class="small-btn delete" onclick="removeSect(this)">
                    X
                </button>
            `;

            sectContainer.appendChild(row);
        });
    }

    container.appendChild(section);
})
};

/* ==========================================================
   OPTIONS BUILDERS
========================================================== */

function buildSubdistrictOptions(selected = "") {
    let html = "";

    subdistrictOptions.forEach(sub => {
        html += `
            <option value="${sub.id}" ${selected == sub.id ? "selected" : ""}>
                ${sub.name}
            </option>
        `;
    });

    return html;
}

function buildSectOptions(selected = "") {
    let html = "";

    sectOptions.forEach(sect => {
        html += `
            <option value="${sect.id}" ${selected == sect.id ? "selected" : ""}>
                ${sect.name}
            </option>
        `;
    });

    return html;
}

/* ==========================================================
   CREATE DISTRICT
========================================================== */

function addSubdistrict() {

    const section = document.createElement("div");
    section.className = "section";

    section.innerHTML = `
        <label>القضاء</label>

        <select class="subdistrict-select">
            ${buildSubdistrictOptions()}
        </select>

        <label>مجموع المقاعد</label>

        <input type="number" class="subdistrict-seats" min="1" value="1">

        <h4>توزيع المقاعد حسب الطائفة</h4>

        <div class="sectContainer"></div>

        <button type="button" class="add-btn" onclick="addSect(this)">
            + إضافة طائفة
        </button>

        <button type="button" class="small-btn delete" onclick="removeSubdistrict(this)">
            حذف القضاء
        </button>
    `;

    subdistrictContainer.appendChild(section);
}

/* ==========================================================
   SECT HANDLERS
========================================================== */

function addSect(button) {

    const container = button.parentElement.querySelector(".sectContainer");

    const row = document.createElement("div");
    row.className = "row";

    row.innerHTML = `
        <select class="sect-select">
            ${buildSectOptions()}
        </select>

        <input type="number" class="sect-seats" min="1" value="1">

        <button type="button" class="small-btn delete" onclick="removeSect(this)">
            X
        </button>
    `;

    container.appendChild(row);
}

function removeSect(button) {
    button.parentElement.remove();
}

function removeSubdistrict(button) {
    button.closest(".section").remove();
}

/* ==========================================================
   VALIDATION + SERIALIZE (UNCHANGED CORE)
========================================================== */

function validateDistrict() {

    const sections = document.querySelectorAll(".section");

    if (sections.length === 0) {
        alert("Please add at least one subdistrict.");
        return false;
    }

    const selectedSubs = [];

    for (const section of sections) {

        const subId = section.querySelector(".subdistrict-select").value;

        if (selectedSubs.includes(subId)) {
            alert("A subdistrict cannot be added twice.");
            return false;
        }

        selectedSubs.push(subId);

        const rows = section.querySelectorAll(".row");

        if (rows.length === 0) {
            alert("Each subdistrict must contain at least one sect.");
            return false;
        }

        const usedSects = [];

        for (const row of rows) {

            const sectId = row.querySelector(".sect-select").value;

            if (usedSects.includes(sectId)) {
                alert("Duplicate sect in the same subdistrict.");
                return false;
            }

            usedSects.push(sectId);
        }
    }

    return true;
}

function buildDistrictJSON() {

    const result = [];

    document.querySelectorAll(".section").forEach(section => {

        const subdistrict = {
            subdistrict_id: parseInt(section.querySelector(".subdistrict-select").value),
            seats: parseInt(section.querySelector(".subdistrict-seats").value),
            sects: []
        };

        section.querySelectorAll(".row").forEach(row => {

            subdistrict.sects.push({
                sect_id: parseInt(row.querySelector(".sect-select").value),
                seats: parseInt(row.querySelector(".sect-seats").value)
            });

        });

        result.push(subdistrict);
    });

    return result;
}

/* ==========================================================
   SUBMIT CREATE
========================================================== */

createForm.addEventListener("submit", function (e) {

    if (!validateDistrict()) {
        e.preventDefault();
        return;
    }

    const old = document.querySelector('input[name="data"]');
    if (old) old.remove();

    const hidden = document.createElement("input");
    hidden.type = "hidden";
    hidden.name = "data";
    hidden.value = JSON.stringify(buildDistrictJSON());

    createForm.appendChild(hidden);
});

/* ==========================================================
   BUTTONS
========================================================== */

document.getElementById("addSubdistrictButton")
    .addEventListener("click", addSubdistrict);

</script>

</body>

</html>
